<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptverwalter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Rezeptverwalter</h1>
  </header>

  <main>
    <section class="rezept-formular-bereich">
      <h2>Neues Rezept hinzufügen</h2>
      <form id="rezept-formular">
        <div class="formular-feld">
          <label for="rezept-name">Name des Rezepts</label>
          <input type="text" id="rezept-name" name="rezept-name" required>
        </div>

        <div class="formular-feld">
          <label for="rezept-zutaten">Zutaten (mit Komma getrennt)</label>
          <textarea id="rezept-zutaten" name="rezept-zutaten" required></textarea>
        </div>

        <div class="formular-feld">
          <label for="rezept-zubereitung">Zubereitung</label>
          <textarea id="rezept-zubereitung" name="rezept-zubereitung" required></textarea>
        </div>

        <button type="submit">Rezept speichern</button>
      </form>
    </section>

    <section class="rezept-liste-bereich">
      <h2>Meine Rezepte</h2>
      <ul id="rezept-liste"></ul>
    </section>
  </main>

  <footer>
    <p>WI_A_Gruppe_9 &middot; Portfolioprüfung Einführung Webtechnologien</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
